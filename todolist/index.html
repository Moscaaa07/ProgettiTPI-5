<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I miei task</title>
</head>
<body>

  <main>
    <h1>I miei task</h1>

    <!-- Contenitore per il messaggio di benvenuto persistente -->
    <div id="benvenuto"></div>

    <form id="form-task">
      <input
        type="text"
        id="campo-task"
        placeholder="Scrivi qui un task..."
        autocomplete="off">
      <button type="submit">Aggiungi</button>
    </form>

    <ul id="lista"></ul>

    <!-- Barra info totale e messaggio reattivo -->
    <p id="info"></p>
    <p id="messaggio"></p>

    <!-- Contenitore per il pulsante "Elimina completati" -->
    <div id="azioni"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
